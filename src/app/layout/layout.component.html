<main class="layout">
    <!-- Контейнер для фоновых изображений -->
    <div class="background-container">
        <!-- Текущее изображение -->
        <img
            [src]="currentImage.url"
            class="background-image current"
            alt="Season background"
            [class.loading]="!currentImage.loaded"
            (load)="onImageLoad($event, 'current')"
        />

        <!-- Следующее изображение (для плавного перехода) -->
        @if (isTransitioning() && nextImage.url) {
            <img
                [src]="nextImage.url"
                class="background-image next"
                alt="Next season background"
                [class.loading]="!nextImage.loaded"
                (load)="onImageLoad($event, 'next')"
            />
        }

        <!-- Слой с размытием по краям (Способ 3) -->
        <div class="blur-overlay"></div>
    </div>

    @if (!isMobile()) {
        <mat-sidenav-container
            class="sidenav-container"
            [hasBackdrop]="false"
        >
            <mat-sidenav
                #sidenav
                mode="side"
                position="start"
                [opened]="isSideNavOpened()"
                [fixedInViewport]="true"
                class="navigation-sidenav"
                [style.width.px]="computedSideNavWidth()"
            >
                <cv-navigation-side-bar (navigate)="onNavigation()" />
            </mat-sidenav>

            <mat-sidenav-content
                class="content"
                [style.z-index]="1111"
            >
                <!-- Кнопка переключения сайдбара -->
                <button
                    mat-icon-button
                    class="nav-toggle-btn"
                    (click)="toggleSideNav()"
                    [matTooltip]="
                        isSideNavOpened()
                            ? ('LAYOUT.HIDE_NAVIGATION' | translate)
                            : ('LAYOUT.SHOW_NAVIGATION' | translate)
                    "
                    [style.left.px]="computedSideNavWidth() - 20"
                    [style.z-index]="1111"
                >
                    <mat-icon>
                        {{
                            isSideNavOpened() ? 'chevron_left' : 'chevron_right'
                        }}
                    </mat-icon>
                </button>

                <!-- Основной контент -->
                <div class="page-content">
                    <router-outlet />
                </div>
            </mat-sidenav-content>
        </mat-sidenav-container>
    } @else {
        <div class="layout-container">
            <cv-mobile-header
                [isMenuOpened]="isMobileMenuOpened()"
                (toggleMenu)="toggleMobileMenu()"
            />

            <!-- Мобильное меню -->
            @if (isMobileMenuOpened()) {
                <div class="mobile-menu">
                    <cv-navigation-side-bar (navigate)="onMobileNavigation()" />
                </div>
            }

            <div class="page-content">
                <router-outlet />
            </div>
        </div>
    }
    <cv-layout-footer
        [season]="currentSeason"
        (next)="nextImageManually()"
    />
</main>
