<main class="layout">
    @if (!isMobile()) {
        <mat-sidenav-container
            class="sidenav-container"
            [hasBackdrop]="false"
        >
            <mat-sidenav
                mode="side"
                position="start"
                [opened]="isSideNavOpened()"
                [fixedInViewport]="true"
                class="navigation-sidenav"
                [style.width.px]="computedSideNavWidth()"
            >
                <cv-navigation-side-bar (navigate)="onNavigation()" />
            </mat-sidenav>

            <mat-sidenav-content
                class="content"
                [style.z-index]="1111"
            >
                <button
                    mat-icon-button
                    class="nav-toggle-btn"
                    (click)="toggleSideNav()"
                    [matTooltip]="
                        isSideNavOpened()
                            ? ('LAYOUT.HIDE_NAVIGATION' | translate)
                            : ('LAYOUT.SHOW_NAVIGATION' | translate)
                    "
                    [style.left.px]="computedSideNavWidth() - 20"
                    [style.z-index]="1111"
                >
                    <mat-icon>
                        {{
                            isSideNavOpened() ? 'chevron_left' : 'chevron_right'
                        }}
                    </mat-icon>
                </button>

                <div class="page-content">
                    <router-outlet />
                </div>
            </mat-sidenav-content>
        </mat-sidenav-container>
    } @else {
        <div class="layout-container">
            <cv-mobile-header></cv-mobile-header>
            <div class="page-content">
                <router-outlet />
            </div>
        </div>
    }
</main>
