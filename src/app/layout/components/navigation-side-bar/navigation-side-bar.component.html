<nav class="navigation-sidebar">
    <div class="sidebar-header">
        <h2 class="sidebar-title">{{ 'LAYOUT.NAVIGATION' | translate }}</h2>
    </div>

    <mat-nav-list class="nav-list">
        @for (routeItem of navRoutes; track routeItem.route) {
            <a
                mat-list-item
                [routerLink]="routeItem.path"
                routerLinkActive="active"
                (click)="onNavigate()"
            >
                @if (routeItem.icon) {
                    <mat-icon matListItemIcon>
                        {{ routeItem.icon }}
                    </mat-icon>
                }
                <span matListItemTitle>
                    {{ routeItem.translationKey | translate }}
                </span>
            </a>
        }
    </mat-nav-list>

    <div class="sidebar-footer">
        <cv-language-switcher />
    </div>
</nav>
