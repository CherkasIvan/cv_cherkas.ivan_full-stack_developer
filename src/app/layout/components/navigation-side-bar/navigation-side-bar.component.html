@if (isDesktopMode()) {
    <aside class="desktop-sidebar">
        <nav class="sidebar-content">
            <div class="sidebar-header">
                <h3 class="m-0">Навигация</h3>
            </div>

            <div
                class="theme-switch-container flex align-items-center justify-content-between p-3"
            >
                <label
                    for="themeToggle"
                    class="flex align-items-center gap-2"
                >
                    <i class="pi pi-moon"></i>
                    <span>Темная тема</span>
                </label>

                <p-toggleswitch
                    id="themeToggle"
                    [ngModel]="themeService.isDarkMode()"
                    (onChange)="themeService.toggleTheme()"
                />
            </div>

            <div class="navigation-menu mt-4">
                @for (item of navigationItems(); track item.label) {
                    <a
                        class="p-button p-button-text block mb-2"
                        [routerLink]="item.routerLink"
                        [queryParams]="item.queryParams"
                    >
                        <i
                            [class]="item.icon"
                            class="mr-2"
                        ></i>
                        {{ item.label }}
                    </a>
                }
            </div>
        </nav>
    </aside>
} @else {
    <nav class="mobile-navigation">
        <p-drawer
            [visible]="drawerVisible()"
            (onHide)="closeDrawer()"
            header="Навигация"
            position="left"
            [style]="{ width: '320px' }"
            [modal]="true"
            [dismissible]="true"
            [showCloseIcon]="true"
        >
            <div class="drawer-content">
                <div
                    class="theme-switch-container flex align-items-center justify-content-between p-3"
                >
                    <label
                        for="themeToggleMobile"
                        class="flex align-items-center gap-2"
                    >
                        <i class="pi pi-moon"></i>
                        <span>Темная тема</span>
                    </label>

                    <p-toggleswitch
                        id="themeToggleMobile"
                        [ngModel]="themeService.isDarkMode()"
                        (onChange)="themeService.toggleTheme()"
                    />
                </div>

                <div class="navigation-menu mt-4">
                    @for (item of navigationItems(); track item.label) {
                        <a
                            class="p-button p-button-text block mb-2"
                            (click)="navigate(item)"
                        >
                            <i
                                [class]="item.icon"
                                class="mr-2"
                            ></i>
                            {{ item.label }}
                        </a>
                    }
                </div>
            </div>
        </p-drawer>
    </nav>
}
