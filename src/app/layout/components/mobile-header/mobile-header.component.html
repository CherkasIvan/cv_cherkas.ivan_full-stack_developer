<header class="mobile-header">
    <nav>
        <p-menubar [model]="menuItems()">
            <ng-template #start>
                <svg
                    width="33"
                    height="35"
                    viewBox="0 0 33 35"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    class="header-logo"
                >
                    <path
                        d="M16.5 0L33 8.75V26.25L16.5 35L0 26.25V8.75L16.5 0Z"
                        fill="var(--primary-color)"
                    />
                </svg>
            </ng-template>

            <ng-template
                #item
                let-item
            >
                <a
                    [routerLink]="item.routerLink || []"
                    [queryParams]="item.queryParams"
                    pRipple
                    class="flex items-center px-4 py-3 cursor-pointer gap-2"
                    (click)="item.command ? item.command() : null"
                >
                    @if (item.icon) {
                        <i
                            [class]="item.icon"
                            class="mr-2"
                        ></i>
                    }
                    <span>{{ item.label }}</span>
                    @if (item.badge) {
                        <p-badge
                            [value]="item.badge"
                            class="ml-2"
                        />
                    }
                    @if (item.shortcut) {
                        <span
                            class="ms-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1"
                        >
                            {{ item.shortcut }}
                        </span>
                    }
                    @if (item.items) {
                        <i class="ms-auto pi pi-angle-down"></i>
                    }
                </a>
            </ng-template>

            <ng-template #end>
                <div class="flex items-center gap-4">
                    <div class="theme-toggle flex items-center gap-2">
                        <i class="pi pi-moon"></i>
                        <p-toggleswitch
                            [ngModel]="themeService.isDarkMode()"
                            (onChange)="themeService.toggleTheme()"
                            class="theme-switch"
                        />
                    </div>

                    <input
                        type="text"
                        pInputText
                        placeholder="Search"
                        class="search-input"
                    />

                    <p-avatar
                        image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
                        shape="circle"
                        size="normal"
                    />
                </div>
            </ng-template>
        </p-menubar>
    </nav>
</header>
