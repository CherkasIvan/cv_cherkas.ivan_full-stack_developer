<p-menubar
    [model]="items"
    [class]="'theme-transition'"
/>

<div class="theme-switch-container">
    <p-toggleswitch
        [(ngModel)]="isDarkMode"
        (onChange)="toggleDarkMode()"
        [inputId]="'themeSwitch'"
        [style]="{ 'margin-left': '1rem' }"
    />
    <label
        for="themeSwitch"
        class="theme-label ml-2"
    >
        {{ isDarkMode ? '🌙 Темная' : '☀️ Светлая' }}
    </label>
</div>

<ng-content></ng-content>
