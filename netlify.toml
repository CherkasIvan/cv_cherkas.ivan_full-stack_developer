# Netlify Configuration
[build]
  # Use Node.js 20
  environment = { NODE_VERSION = "20" }

  # Build command
  command = "npm run build:netlify"

  # Publish directory (must match angular.json outputPath)
  publish = "dist/cv_cherkas.ivan_full-stack_developer/browser"

# Development context
[context.develop]
  command = "npm run build:development"
  environment = { NODE_ENV = "development" }

# Production context
[context.production]
  command = "npm run build:netlify"
  environment = { NODE_ENV = "production" }

# Branch deploy contexts
[context.branch-deploy]
  command = "npm run build:development"
  environment = { NODE_ENV = "development" }

[context.deploy-preview]
  command = "npm run build:netlify"
  environment = { NODE_ENV = "production" }

# Essential SPA redirects - MUST COME FIRST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# API redirects (if you have APIs)
[[redirects]]
  from = "/api/*"
  to = "https://api.example.com/:splat"
  status = 200

# Static assets caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=UTF-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=UTF-8"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/json; charset=UTF-8"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # Performance headers
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # CORS headers (if needed)
    Access-Control-Allow-Origin = "*"

# Environment variables
[build.environment]
  # Enable Angular build cache
  NG_CLI_CACHE = "true"
  # Force clean builds
  CI = "true"

# Edge functions (optional)
# [[edge_functions]]
#   path = "/api/*"
#   function = "api"
